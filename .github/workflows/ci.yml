name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3']
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Full suite (server core + ActiveRecord integration)
        run: bundle exec rake test
      - name: ActiveRecord example runs for real
        run: bundle exec ruby -Ilib examples/activerecord_model.rb

  core-no-activerecord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Core suite with no gems installed (zero-dependency claim)
        run: ruby -Ilib -Itest test/server_core_test.rb
      - name: Plain (no-AR) example runs for real, with zero gems installed
        run: ruby -Ilib examples/plain_tools.rb
      - name: Throughput benchmark runs for real, with zero gems installed
        run: ruby -Ilib bench/throughput_bench.rb 2000

  gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem build acts_as_mcp.gemspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Style check (standardrb)
        run: bundle exec standardrb
